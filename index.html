<!DOCTYPE html>
<!-- Portfolio document shell for src/main.jsx; restores the saved theme before rendering. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kolby Hernandez | Full-Stack Engineer & Systems Architect</title>
    <meta name="description" content="Portfolio of Kolby Hernandez - Full-Stack Software Engineer specializing in modern web applications, distributed systems, and sleek interactive interfaces." />
    <!-- Security meta headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Self-hosted above-the-fold fonts; italic display and extra weights load only when used. -->
    <link rel="preload" href="%BASE_URL%fonts/junicode-roman-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/bricolage-regular.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Resolve the explicit theme preference before first paint; light is the default. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('kolby-portfolio-theme') === 'dark') theme = 'dark';
        } catch (error) { /* Storage may be blocked; keep the light default. */ }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
